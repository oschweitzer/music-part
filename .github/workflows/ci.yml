name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui check
      - run: pnpm --filter ui test
      - run: pnpm --filter ui build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev
      # The Tauri crate embeds ui/dist at compile time, so build the UI first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui build
      - name: SoundFont cache
        uses: actions/cache@v4
        with:
          path: assets/soundfonts/GeneralUser-GS.sf2
          key: soundfont-${{ hashFiles('scripts/fetch-soundfont.mjs') }}
      - run: pnpm fetch:soundfont
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui build
      - name: SoundFont cache
        uses: actions/cache@v4
        with:
          path: assets/soundfonts/GeneralUser-GS.sf2
          key: soundfont-${{ hashFiles('scripts/fetch-soundfont.mjs') }}
      - run: pnpm fetch:soundfont
      # Chrome is preinstalled on the runner; the tests find it on the PATH.
      - run: pnpm e2e
